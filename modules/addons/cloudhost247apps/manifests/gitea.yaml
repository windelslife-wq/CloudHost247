# CloudHost247 App Cloud manifest — Gitea
schema: 1
id: gitea
name: Gitea
slug: gitea
category: developer-tools
kind: application
vendor: Gitea contributors
license: MIT
summary: Lightweight self-hosted Git hosting with CI and issue tracking.
description: Gitea provides Git repositories, pull requests, issues, packages and Actions in a single lightweight container with a Postgres backend. SSH access runs on the node through the platform's proxy rules; HTTPS is terminated by Traefik.
website: https://about.gitea.com
repository: https://github.com/go-gitea/gitea
documentation: https://docs.gitea.com
logo_url: https://cdn.cloudhost247.test/apps/gitea.svg
tags: [git, developer, ci, issues, repositories]
version: 1.22.3
channel: stable
featured: false

deployment:
  engine: docker-compose
  supported_hosting_types: [vps, dedicated, docker, kubernetes]
  update_strategy: recreate

requirements:
  cpu_min: 1
  cpu_recommended: 2
  memory_min_mb: 1024
  memory_recommended_mb: 2048
  storage_min_mb: 10240
  storage_recommended_mb: 51200
  gpu: false

services:
  app:
    image: gitea/gitea:1.22.3
    port: 3000
    primary: true
    restart: unless-stopped
    user: "1000:1000"
    depends_on: [db]
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: ${DB_NAME}
      GITEA__database__USER: ${DB_USER}
      GITEA__database__PASSWD: ${DB_PASSWORD}
      GITEA__server__DOMAIN: ${PRIMARY_DOMAIN}
      GITEA__server__ROOT_URL: https://${PRIMARY_DOMAIN}/
      GITEA__server__SSH_DOMAIN: ${PRIMARY_DOMAIN}
      GITEA__server__HTTP_PORT: "3000"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${SECRET_KEY}
      USER_UID: "1000"
      USER_GID: "1000"
    volumes:
      - name: data
        mount: /data
        size_mb: 40960
        backup: true
      - name: config
        mount: /data/gitea/conf
        size_mb: 512
        backup: true
  db:
    image: postgres:16-alpine
    internal: true
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - name: dbdata
        mount: /var/lib/postgresql/data
        size_mb: 10240
        backup: true

environment:
  required:
    - key: ADMIN_USERNAME
      description: Gitea administrator account created on first boot.
      validation: username
    - key: ADMIN_EMAIL
      description: Administrator email address.
      validation: email
  optional:
    - key: TZ
      description: Server timezone.
      default: UTC
  generated:
    - key: SECRET_KEY
      generate: secret
      secret: true
    - key: ADMIN_PASSWORD
      generate: password
      secret: true
    - key: DB_NAME
      generate: uuid
    - key: DB_USER
      generate: uuid
    - key: DB_PASSWORD
      generate: password
      secret: true

databases:
  - name: gitea
    engine: postgres
    version: "16"
    isolated: true
    service: db

volumes:
  - name: data
    service: app
    mount: /data
    size_mb: 40960
  - name: dbdata
    service: db
    mount: /var/lib/postgresql/data
    size_mb: 10240

dependencies:
  - id: postgresql
    type: database
    requirement: required
    isolation: isolated

ports: [3000]

healthcheck:
  type: http
  path: /api/healthz
  port: 3000
  interval: 30s
  timeout: 8s
  retries: 4
  expected_status: [200]

domain:
  enabled: true
  required: true
  path: /

ssl:
  enabled: true
  force_https: true
  min_tls: VersionTLS12

backup:
  enabled: true
  schedule: daily
  retention_days: 14
  include_volumes: [data, dbdata]
  include_databases: [gitea]
  pre_update: true

update:
  strategy: recreate
  backup_before: true
  health_check_after: true
  rollback_on_failure: true
  auto_update_allowed: true
