# CloudHost247 App Cloud — catalog registry
#
# The wider catalog. These entries are imported as DRAFT rows and are explicitly
# **not deployable**: a catalog entry is not a promise that the platform can
# install something. An entry becomes deployable only when a manifest for it is
# written and passes all seven publication gates (manifest, security,
# deployment, health check, backup, update, uninstall).
#
# kind implements the specification's distinction:
#   application    — a customer-facing product (n8n, Nextcloud, WordPress)
#   infrastructure — a dependency/service other applications use (PostgreSQL,
#                    Redis, RabbitMQ, Qdrant, Docker, Traefik)
#   platform       — a stack or runtime (LEMP, LAMP, MERN, MEAN, Kubernetes)
schema: 1
updated: 2026-01-01

